name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Bioconductor devel: the app needs scDiagnostics >= 1.7.5, which is
      # newer than the current Bioconductor release.
      image: bioconductor/bioconductor_docker:devel

    steps:
      - uses: actions/checkout@v4

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          # Where the container actually installs packages; host-site-library
          # only exists when the image is run with a mounted volume.
          path: /usr/local/lib/R/site-library
          key: ${{ runner.os }}-bioc-devel-${{ hashFiles('app/manifest.json') }}
          restore-keys: ${{ runner.os }}-bioc-devel-

      - name: Install dependencies
        env:
          # remotes reads the ref metadata from the GitHub API before it
          # downloads. Unauthenticated, that is 60 requests an hour shared
          # across the runner's IP, which is normally already spent.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          options(repos = BiocManager::repositories(), Ncpus = 2)
          # BiocManager delegates GitHub installs to remotes, which the
          # Bioconductor image does not ship.
          if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes")
          BiocManager::install("ccb-hms/scDiagnostics", ask = FALSE, update = FALSE)
          pkgs <- c("shiny", "bslib", "bsicons", "DT", "cachem", "digest",
                    "future", "promises", "ggplot2", "GGally", "ggridges",
                    "scran", "scater", "ComplexHeatmap", "zellkonverter",
                    # The MERFISH preset is a SpatialExperiment.
                    "SpatialExperiment",
                    "shinytest2", "lintr", "rsconnect")
          missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) BiocManager::install(missing, ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Check the installed package version
        working-directory: app
        run: |
          for (f in list.files("R", pattern = "[.]R$", full.names = TRUE)) source(f)
          msg <- check_package_version()
          if (!is.null(msg)) stop(msg)
          cat("scDiagnostics", as.character(packageVersion("scDiagnostics")), "\n")
        shell: Rscript {0}

      - name: Lint
        working-directory: app
        run: |
          # Configuration lives in app/.lintr.
          lints <- lintr::lint_dir("R")
          print(lints)
          if (length(lints)) quit(status = 1)
        shell: Rscript {0}

      # The manifest must reflect the code, or a deploy installs the wrong
      # dependency set. This runs here rather than in a job of its own
      # because writeManifest has to snapshot the whole library, which the
      # step above has already built.
      - name: Check the manifest against the code
        run: |
          path <- "app/manifest.json"
          committed <- readLines(path)
          before <- jsonlite::fromJSON(path, simplifyVector = FALSE)
          options(renv.config.snapshot.validate = FALSE)
          rsconnect::writeManifest(appDir = "app", appPrimaryDoc = "app.R")
          after <- jsonlite::fromJSON(path, simplifyVector = FALSE)
          writeLines(committed, path)

          # Recorded package versions and the "platform" field describe the
          # library that generated the manifest, so they differ here by
          # design and comparing the file byte for byte would always fail.
          # Staleness that actually breaks a deploy is a dependency or a
          # source file the manifest does not list.
          report <- function(what, old, new) {
            stale <- setdiff(old, new)
            fresh <- setdiff(new, old)
            if (length(stale)) {
              cat("manifest.json lists", what, "the app no longer uses:\n  ",
                  paste(stale, collapse = ", "), "\n")
            }
            if (length(fresh)) {
              cat("manifest.json is missing", paste0(what, ":"), "\n  ",
                  paste(fresh, collapse = ", "), "\n")
            }
            length(stale) + length(fresh)
          }
          drift <- report("packages", names(before$packages), names(after$packages)) +
            report("files", names(before$files), names(after$files))
          if (drift) {
            cat("\nRegenerate it from the repository root and commit:\n")
            cat("  options(repos = BiocManager::repositories())\n")
            cat("  rsconnect::writeManifest(appDir = \"app\", appPrimaryDoc = \"app.R\")\n")
            quit(status = 1)
          }
          cat("manifest.json covers", length(after$packages), "packages and",
              length(after$files), "files; both match the code.\n")
        shell: Rscript {0}

      # Everything except the browser suite, which needs Chrome.
      - name: Test
        working-directory: app
        run: Rscript tests/run-all.R boot test-modules test-async test-registry test-plots

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Test the app end to end
        working-directory: app
        env:
          NOT_CRAN: "true"
        run: Rscript tests/test-app.R

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            app/tests/_snaps
            app/shots_tmp
          if-no-files-found: ignore
